{% extends 'base.html' %}
{% load static %}

{% block content %}




<div class="container mt-5 mb-5">

    <div class="row justify-content-center">

        <div class="col-lg-6">

            <div class="card border-0 shadow-lg rounded-4">

                <div class="card-body p-5 text-center">

                    <div class="mb-4">

                        <div class="bg-danger bg-opacity-10 rounded-circle d-inline-flex justify-content-center align-items-center"
                             style="width:110px; height:110px;">

                            <i class="fa-solid fa-trash text-white fa-3x"></i>

                        </div>

                    </div>

                    <h2 class="fw-bold text-danger mb-3">

                        Delete Recruiter?

                    </h2>

                    <p class="text-muted fs-5">

                        You are about to permanently delete

                        <strong>

                            {{ recruiter.company_name }}

                        </strong>

                        from ThozhilConnect.

                    </p>

                    <div class="alert alert-warning rounded-3 mt-4">

                        <i class="fa-solid fa-triangle-exclamation me-2"></i>

                        This action cannot be undone.

                    </div>

                    <form method="POST" class="mt-4">

                        {% csrf_token %}

                        <div class="d-flex justify-content-center gap-3">

                            <a href="{% url 'adminpanel:recruiters' %}"
                               class="btn btn-secondary rounded-pill px-5">

                                <i class="fa-solid fa-arrow-left me-2"></i>

                                Cancel

                            </a>

                            <button type="submit"
                                    class="btn btn-danger rounded-pill px-5">

                                <i class="fa-solid fa-trash me-2"></i>

                                Delete

                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
