{% extends 'base.html' %}

{% block content %}

<div class="container py-5">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h2>Manage Categories</h2>

        <a href="{% url 'adminpanel:add_category' %}"
           class="btn btn-success">

            Add Category

        </a>

    </div>

    <div class="card shadow">

        <div class="card-body">

            <table class="table table-hover">

                <thead class="table-dark">

                    <tr>

                        <th>#</th>

                        <th>Category Name</th>

                        <th>Action</th>

                    </tr>

                </thead>

                <tbody>

                {% for category in categories %}

                    <tr>

                        <td>

                            {{ forloop.counter }}

                        </td>

                        <td>

                            {{ category.category_name }}

                        </td>

                        <td>

                            <a href="{% url 'adminpanel:edit_category' category.id %}"
                               class="btn btn-warning btn-sm">

                                Edit

                            </a>

                            <a href="{% url 'adminpanel:delete_category' category.id %}"
                               class="btn btn-danger btn-sm">

                                Delete

                            </a>

                        </td>

                    </tr>

                {% empty %}

                    <tr>

                        <td colspan="3"
                            class="text-center">

                            No Categories Found

                        </td>

                    </tr>

                {% endfor %}

                </tbody>

            </table>

        </div>

    </div>

    <div class="mt-3">

        <a href="{% url 'adminpanel:admindashboard' %}"
           class="btn btn-secondary">

            Back

        </a>

    </div>

</div>

{% endblock %}
