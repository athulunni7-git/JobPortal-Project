
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Career Assistant | ThozhilConnect</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background: #f1f5f9;
            font-family: Arial, sans-serif;
        }

        .chat-container {
            max-width: 800px;
            margin: 40px auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            overflow: hidden;
        }

        .chat-header {
            background: #0f172a;
            color: white;
            padding: 22px;
        }

        .chat-header h2 {
            font-size: 23px;
            margin: 0;
        }

        .chat-header p {
            margin: 6px 0 0;
            color: #cbd5e1;
        }

        .chat-messages {
            height: 420px;
            overflow-y: auto;
            padding: 24px;
        }

        .message {
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 16px;
            max-width: 85%;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .bot-message {
            background: #e2e8f0;
            color: #0f172a;
            margin-right: auto;
        }

        .user-message {
            background: #2b9bff;
            color: white;
            margin-left: auto;
        }

        .chat-input {
            padding: 18px;
            border-top: 1px solid #e2e8f0;
        }

        #message-input {
            border-radius: 10px;
            padding: 12px;
        }

        #send-button {
            background: #2b9bff;
            border: none;
            color: white;
            border-radius: 10px;
            padding: 0 24px;
        }

        #send-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
    </style>
</head>

<body>

    <div class="chat-container">

        <div class="chat-header">
            <h2>🤖 ThozhilConnect AI Assistant</h2>
            <p>Your career and job-search companion</p>
        </div>

        <div class="chat-messages" id="chat-messages">

            <div class="message bot-message">
                Hi! 👋 Welcome to ThozhilConnect.

                I can help you explore career options, prepare for interviews, and find jobs.

                What would you like help with?
            </div>

        </div>

        <form class="chat-input" id="chat-form">

            {% csrf_token %}

            <div class="d-flex gap-2">

                <input
                    type="text"
                    id="message-input"
                    class="form-control"
                    placeholder="Ask me about jobs or careers..."
                    required
                >

                <button type="submit" id="send-button">
                    Send
                </button>

            </div>

        </form>

    </div>

    <script>

        // Select the HTML elements

        const form = document.getElementById("chat-form");
        const input = document.getElementById("message-input");
        const chatBox = document.getElementById("chat-messages");
        const sendButton = document.getElementById("send-button");


        // Run this code when the user sends a message

        form.addEventListener("submit", async function(event) {

            event.preventDefault();

            // Get the user's message

            const message = input.value.trim();

            if (message === "") {
                return;
            }

            // Show the user's message

            const userMessage = document.createElement("div");

            userMessage.className = "message user-message";
            userMessage.textContent = message;

            chatBox.appendChild(userMessage);

            // Clear the input box

            input.value = "";

            // Disable the button while waiting for a reply

            sendButton.disabled = true;
            const thinkingMessage = document.createElement("div");

            thinkingMessage.className = "message bot-message";
            thinkingMessage.textContent = "🤖 AI is thinking...";

            chatBox.appendChild(thinkingMessage);

            chatBox.scrollTop = chatBox.scrollHeight;


            try {

                // Prepare the message to send to Django

                const formData = new FormData();

                formData.append("message", message);

                // Send the message to Django

                const response = await fetch("/ai_assistant/chat/", {

                    method: "POST",

                    headers: {
                        "X-CSRFToken": document.querySelector(
                            "[name=csrfmiddlewaretoken]"
                        ).value
                    },

                    body: formData

                });

                // Check whether the request was successful

                if (!response.ok) {
                    throw new Error("Server error: " + response.status);
                }

                // Get the response from Django

                const data = await response.json();

                // Display the chatbot's reply

                const botMessage = document.createElement("div");

                botMessage.className = "message bot-message";
                botMessage.textContent = data.reply;

                chatBox.appendChild(botMessage);

            } catch (error) {

                // Display an error message

                const errorMessage = document.createElement("div");

                errorMessage.className = "message bot-message";

                errorMessage.textContent =
                    "Sorry, something went wrong. Please try again.";

                chatBox.appendChild(errorMessage);

                console.log(error);

            }

            // Scroll to the latest message

            chatBox.scrollTop = chatBox.scrollHeight;

            // Enable the button again

            sendButton.disabled = false;

            input.focus();

        });

    </script>

</body>
</html>
