{% extends 'base.html' %}

{% block content %}

<div class="container py-5 w-50">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h2>Categories</h2>

    </div>

    <div class="card shadow">

        <div class="card-body">

            <table class="table table-hover">

                <thead class="table-dark">

                    <tr>

                        <th>#</th>

                        <th>Category Name</th>

                        

                    </tr>

                </thead>

                <tbody>

                {% for category in categories %}

                    <tr>

                        <td>

                            {{ forloop.counter }}

                        </td>

                        <td>

                            {{ category.category_name }}

                        </td>

                       
                    </tr>

                {% empty %}

                    <tr>

                        <td colspan="3"
                            class="text-center">

                            No Categories Found

                        </td>

                    </tr>

                {% endfor %}

                </tbody>

            </table>

        </div>

    </div>

    

</div>

{% endblock %}
