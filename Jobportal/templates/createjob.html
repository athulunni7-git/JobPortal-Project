{% extends 'base.html' %}
{% load static %}
{% load crispy_forms_tags %}

{% block content %}

<!-- Hero Section -->
<div class="container-fluid page-header mb-5">
    <div class="container">

        <div class="py-5">

            <h1 class="display-5 text-white fw-bold">
                Post a New Job
            </h1>

            <p class="text-white-50 fs-5">
                Reach thousands of job seekers by publishing your vacancy.
            </p>

        </div>

    </div>
</div>

<!-- Job Form -->
<div class="container mb-5">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card border-0 shadow-lg rounded-4">

                <div class="card-header bg-secondary text-white py-3 rounded-top-4">

                    <h3 class="mb-0 text-white">
                        <i class="bi bi-briefcase-fill me-2"></i>
                        Job Information
                    </h3>

                </div>

                <div class="card-body p-5">

                    <form method="POST">

                        {% csrf_token %}

                        {{ form|crispy }}

                        <hr class="my-4">

                        <div class="d-flex justify-content-between">

                            <a href="{% url 'jobs:myjobs' %}"
                               class="btn btn-outline-secondary rounded-pill px-4">

                                <i class="bi bi-arrow-left me-2"></i>

                                Cancel

                            </a>

                            <button type="submit"
                                    class="btn btn-secondary rounded-pill px-5 shadow">

                                <i class="bi bi-check-circle me-2"></i>

                                Publish Job

                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
